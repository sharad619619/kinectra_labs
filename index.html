<!DOCTYPE html>
<html lang="en" class="motion-pending">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
  <title>Stop Digging Through Dashboards</title>
  
  <!-- Embedding Variable Fonts (Outfit styled as Reference Sans and Display) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
  
  <style>
    /* Font Declarations */
    @font-face {
      font-family: "Reference Sans";
      src: local("Outfit"), url("https://fonts.gstatic.com/s/outfit/v11/q35yFy1g9v3zGAhUC8ECj2yZ.woff2") format("woff2");
      font-weight: 100 900;
    }
    @font-face {
      font-family: "Reference Display";
      src: local("Outfit"), url("https://fonts.gstatic.com/s/outfit/v11/q35yFy1g9v3zGAhUC8ECj2yZ.woff2") format("woff2");
      font-weight: 400 900;
    }

    /* CSS Variable Declarations */
    :root {
      color-scheme: dark;
      font-family: "Reference Sans", Arial, sans-serif;
      background: #000;
      
      /* Layout Variables */
      --gutter-start: clamp(36px, 4.177vw, 96px);
      --gutter-end: clamp(36px, 4.04vw, 96px);
      --header-top: clamp(20px, 2.264vh, 30px);
      --hero-bottom: clamp(34px, 5.19vh, 64px);
      --display-size: clamp(58px, 7.64vh, 88px);
      --display-leading: clamp(72px, 9.34vh, 106px);
      --copy-size: clamp(14px, 1.70vh, 19px);
      --copy-leading: clamp(19px, 2.17vh, 24px);
      --title-copy-gap: clamp(15px, 2.08vh, 24px);
      --copy-cta-gap: clamp(24px, 3.11vh, 36px);
      --cta-width: clamp(142px, 15.09vh, 168px);
      --cta-height: clamp(38px, 3.96vh, 44px);
      --compact-control-font-size: clamp(17px, 1.75vh, 19px);
      --action-control-font-size: clamp(17px, 1.78vh, 19.5px);
      --primary-control-font-size: clamp(17px, 1.77vh, 19.25px);
      --control-inline-nudge: -1px;
      --control-baseline-shift: clamp(1px, .19vh, 2px);
      --copy-optical-shift: clamp(0px, .1vh, 1px);
      --watch-baseline-shift: clamp(2px, .38vh, 4px);
      --card-width: clamp(150px, 18.96vh, 215px);
    }

    /* Viewport Architecture */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    .viewport {
      position: absolute;
      inset: 0;
      isolation: isolate;
      background: #000;
      width: 100%;
      height: 100%;
    }

    .screen {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 100%;
      height: 100%;
      background: #000;
    }

    /* Edge-to-edge Background Video */
    .background {
      position: absolute;
      inset: 0;
      z-index: -3;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      pointer-events: none;
      user-select: none;
    }

    /* Screen Vignette Overlay */
    .screen::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -2;
      background:
        linear-gradient(180deg, rgba(0,0,0,.03), transparent 24%, transparent 82%, rgba(0,0,0,.05)),
        radial-gradient(ellipse at 44% 54%, transparent 30%, rgba(0,0,0,.055) 100%);
      pointer-events: none;
    }

    /* Glass Language CSS */
    .glass-panel {
      border: 1px solid rgba(255, 255, 255, .13);
      border-radius: clamp(12px, 1.52vh, 18px);
      background: linear-gradient(145deg, rgba(24, 22, 20, .80), rgba(5, 12, 14, .86));
      box-shadow:
        0 2px 10px rgba(0, 0, 0, .44),
        0 0 0 3px rgba(255, 255, 255, .035) inset,
        0 0 0 1px rgba(0, 0, 0, .9);
      backdrop-filter: blur(14px) saturate(108%);
      -webkit-backdrop-filter: blur(14px) saturate(108%);
    }

    /* Header Bar */
    .header {
      position: absolute;
      inset: var(--header-top) var(--gutter-end) auto var(--gutter-start);
      height: 48px;
      display: flex;
      align-items: flex-start;
      white-space: nowrap;
      z-index: 100;
    }

    /* Nav Links */
    .nav {
      margin-left: clamp(36px, 3.03vw, 48px);
      display: flex;
      gap: clamp(32px, 2.9vw, 43px);
      position: relative;
      top: 9px;
    }

    .nav-link {
      font-size: 16px;
      font-weight: 430;
      letter-spacing: -.36px;
      color: rgba(229, 229, 230, .77);
      text-shadow: 0 1px 3px rgba(0, 0, 0, .55);
      text-decoration: none;
      position: relative;
      cursor: pointer;
    }

    .nav-link.active {
      color: #fff;
    }

    .nav-link.active::after {
      content: "";
      position: absolute;
      bottom: -6px;
      left: 50%;
      transform: translateX(-50%);
      width: 44px;
      height: 2px;
      background: rgba(255, 255, 255, .82);
    }

    .nav-link:first-child {
      top: -3px;
    }

    .nav-link:nth-child(4) {
      margin-left: 1px;
    }

    /* Timezone Panel */
    .time-panel {
      margin-left: auto;
      width: 211px;
      height: 48px;
      padding-left: 8px;
      border-left: 2px solid rgba(230, 230, 230, .52);
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      line-height: 1.25;
    }

    .time-label {
      font-size: 15px;
      font-weight: 420;
      color: rgba(240, 240, 240, .77);
    }

    .time-value {
      font-size: 15px;
      font-weight: 440;
      color: rgba(255, 255, 255, .93);
    }

    /* Sign Up CTA */
    .sign-up {
      width: 109px;
      height: 42px;
      border-radius: 7px;
      background: #fff;
      color: #101010;
      font-weight: 460;
      letter-spacing: -.34px;
      border: none;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .72), 0 1px 5px rgba(0, 0, 0, .34);
      margin-left: clamp(20px, 1.95vw, 29px);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Tablet/Mobile Menu Toggle */
    .menu-toggle {
      display: none;
      width: 46px;
      height: 46px;
      border-radius: 11px;
      border: 1px solid rgba(255, 255, 255, .15);
      background: rgba(3, 5, 7, .47);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      color: #fff;
      cursor: pointer;
      align-items: center;
      justify-content: center;
      z-index: 101;
    }

    /* Hero Layout (Bottom Left) */
    .hero {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .hero-content {
      position: absolute;
      left: var(--gutter-start);
      bottom: var(--hero-bottom);
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      pointer-events: auto;
    }

    /* Headline Styling */
    .hero-title {
      font-family: "Reference Display", "Reference Sans", Arial, sans-serif;
      font-size: var(--display-size);
      line-height: var(--display-leading);
      font-weight: 500;
      font-optical-sizing: auto;
      letter-spacing: -2.1px;
      -webkit-text-stroke: .12px currentColor;
      white-space: nowrap;
      text-shadow: 0 2px 2px rgba(0, 0, 0, .44);
      margin: 0 0 var(--title-copy-gap) 0;
    }

    .line {
      display: block;
      overflow: hidden;
      transform-origin: left center;
    }

    .line-one {
      color: #fff;
      transform: scaleX(.775);
    }

    .line-two {
      color: rgba(211, 207, 207, .78);
      transform: scaleX(.793);
    }

    .line-reveal {
      display: block;
    }

    /* Body Copy Styling */
    .hero-copy {
      font-size: var(--copy-size);
      line-height: var(--copy-leading);
      color: rgba(226, 229, 228, .84);
      font-weight: 350;
      letter-spacing: .13px;
      width: clamp(390px, 31.67vw, 500px);
      margin: 0 0 var(--copy-cta-gap) var(--copy-optical-shift);
      text-shadow: 0 1px 3px rgba(0, 0, 0, .7);
    }

    /* Primary CTA Button */
    .primary-cta {
      width: var(--cta-width);
      height: var(--cta-height);
      border-radius: 7px;
      background: #fff;
      color: #111;
      border: none;
      box-shadow: 0 1px 5px rgba(0, 0, 0, .38);
      position: relative;
      cursor: pointer;
      display: flex;
      align-items: center;
    }

    .primary-cta .label {
      position: absolute;
      left: 8.125%;
      font-weight: 450;
      letter-spacing: -.3px;
      font-size: var(--primary-control-font-size);
    }

    .primary-cta .arrow-box {
      position: absolute;
      right: 3.125%;
      top: 14.286%;
      width: 20.625%;
      height: 71.429%;
      border-radius: 7px;
      background: #070909;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .primary-cta .arrow-box svg {
      width: 14px;
      height: 14px;
      stroke: #fff;
      stroke-width: 2.2;
      fill: none;
    }

    /* Demo Card Layout (Bottom Right) */
    .demo-card {
      position: absolute;
      right: var(--gutter-end);
      bottom: var(--hero-bottom);
      width: var(--card-width);
      aspect-ratio: 201 / 265;
      container-type: inline-size;
      pointer-events: auto;
      display: flex;
      flex-direction: column;
      padding: 0;
    }

    .demo-visual {
      position: absolute;
      left: 3.5cqw;
      top: 4cqw;
      width: 92.5cqw;
      height: 92cqw;
      border-radius: 4cqw;
      background: #101a1e;
      overflow: hidden;
    }

    .demo-visual img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(.89) saturate(.93) contrast(1.03);
    }

    /* Circular Play Control Button */
    .play {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 29cqw;
      height: 29cqw;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, .34);
      background: rgba(3, 5, 7, .47);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .play svg {
      width: 32%;
      height: 32%;
      fill: #fff;
      margin-left: 8%; /* visual alignment nudge */
    }

    /* Watch Button Below Visual */
    .watch-button {
      position: absolute;
      left: 3.5cqw;
      bottom: 4cqw;
      width: 92.5cqw;
      height: 20cqw;
      border-radius: 4cqw;
      border: 1px solid rgba(255, 255, 255, .21);
      background: linear-gradient(145deg, rgba(26, 34, 36, .86), rgba(16, 29, 33, .9));
      color: #fff;
      font-size: clamp(13px, 7.5cqw, 16px);
      font-weight: 430;
      letter-spacing: -0.15px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Interactive Hover / Focus Styles */
    @media (prefers-reduced-motion: no-preference) {
      button, a {
        transition: filter 140ms ease, opacity 140ms ease, transform 140ms ease;
      }
      button:hover, a:hover {
        filter: brightness(1.08);
      }
      button:active, a:active {
        transform: scale(0.985);
      }
      
      /* Focus indicators */
      button:focus-visible, a:focus-visible {
        outline: 2px solid #fff;
        outline-offset: 3px;
      }
    }

    /* Entrance Motion Keyframes and Timing */
    @keyframes fade-up {
      from {
        opacity: 0;
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes entrance-brand {
      from {
        opacity: 0;
        transform: translateY(7px) scale(0.94);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes entrance-action {
      from {
        opacity: 0;
        transform: translateY(8px) scale(0.985);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes entrance-line {
      from {
        transform: translate3d(0, 110%, 0) skewY(2deg);
      }
      to {
        transform: translate3d(0, 0, 0) skewY(0deg);
      }
    }

    @keyframes entrance-card {
      from {
        opacity: 0;
        transform: translateY(12px) scale(0.968);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* Motion Pending state rules */
    html.motion-pending .brand { opacity: 0; }
    html.motion-pending .nav-link { opacity: 0; }
    html.motion-pending .time-panel { opacity: 0; }
    html.motion-pending .sign-up { opacity: 0; }
    html.motion-pending .menu-toggle { opacity: 0; }
    html.motion-pending .line-reveal { transform: translate3d(0, 110%, 0) skewY(2deg); }
    html.motion-pending .hero-copy { opacity: 0; }
    html.motion-pending .primary-cta { opacity: 0; }
    html.motion-pending .demo-card { opacity: 0; }

    /* Trigger animations when load completes */
    html:not(.motion-pending) .brand {
      animation: entrance-brand 580ms cubic-bezier(.16,1,.3,1) 60ms forwards;
    }
    html:not(.motion-pending) .nav-link:nth-child(1) {
      animation: fade-up 480ms cubic-bezier(.16,1,.3,1) 130ms forwards;
    }
    html:not(.motion-pending) .nav-link:nth-child(2) {
      animation: fade-up 480ms cubic-bezier(.16,1,.3,1) 175ms forwards;
    }
    html:not(.motion-pending) .nav-link:nth-child(3) {
      animation: fade-up 480ms cubic-bezier(.16,1,.3,1) 220ms forwards;
    }
    html:not(.motion-pending) .nav-link:nth-child(4) {
      animation: fade-up 480ms cubic-bezier(.16,1,.3,1) 265ms forwards;
    }
    html:not(.motion-pending) .time-panel {
      animation: fade-up 520ms cubic-bezier(.16,1,.3,1) 180ms forwards;
    }
    html:not(.motion-pending) .sign-up {
      animation: entrance-action 520ms cubic-bezier(.16,1,.3,1) 220ms forwards;
    }
    html:not(.motion-pending) .menu-toggle {
      animation: entrance-action 520ms cubic-bezier(.16,1,.3,1) 140ms forwards;
    }
    html:not(.motion-pending) .line-one .line-reveal {
      animation: entrance-line 800ms cubic-bezier(.22,1,.36,1) 300ms forwards;
    }
    html:not(.motion-pending) .line-two .line-reveal {
      animation: entrance-line 850ms cubic-bezier(.22,1,.36,1) 440ms forwards;
    }
    html:not(.motion-pending) .hero-copy {
      animation: fade-up 620ms cubic-bezier(.16,1,.3,1) 740ms forwards;
    }
    html:not(.motion-pending) .primary-cta {
      animation: entrance-action 560ms cubic-bezier(.16,1,.3,1) 960ms forwards;
    }
    html:not(.motion-pending) .demo-card {
      transform-origin: 82% 50%;
      animation: entrance-card 920ms cubic-bezier(.22,1,.36,1) 1040ms forwards;
    }

    /* ── Responsive Tablet Breakpoints ── */
    @media (min-width: 620px) and (max-width: 790px),
           (min-width: 620px) and (max-width: 1100px) and (orientation: portrait) {
      .menu-toggle {
        display: flex;
        margin-left: auto;
      }
      .header-actions {
        position: absolute;
        top: 60px;
        right: 0;
        width: min(324px, calc(100vw - 2 * var(--gutter-end)));
        display: flex;
        flex-direction: column;
        align-items: stretch;
        padding: 24px;
        opacity: 0;
        visibility: hidden;
        transform: translateY(-8px) scale(.985);
        transition: opacity 0.25s ease, transform 0.25s ease, visibility 0.25s;
        box-sizing: border-box;
      }
      
      .header.menu-open .header-actions {
        opacity: 1;
        visibility: visible;
        transform: translateY(0) scale(1);
      }

      .nav {
        margin: 0 0 20px 0;
        flex-direction: column;
        gap: 16px;
        top: 0;
      }

      .nav-link:first-child { top: 0; }
      .nav-link.active::after {
        left: 0;
        transform: none;
        bottom: -4px;
        width: 32px;
      }

      .time-panel {
        margin-left: 0;
        width: 100%;
        border-left: none;
        border-top: 1px solid rgba(255, 255, 255, .1);
        padding: 16px 0;
        height: auto;
      }

      .sign-up {
        width: 100%;
        margin-left: 0;
        height: 44px;
      }
    }

    /* ── Responsive Mobile Breakpoints ── */
    @media (max-width: 619px) {
      :root {
        --gutter-start: 24px;
        --gutter-end: 24px;
        --header-top: 16px;
        --hero-bottom: 24px;
      }

      .menu-toggle {
        display: flex;
        margin-left: auto;
      }

      .header-actions {
        position: absolute;
        top: 60px;
        right: 0;
        width: min(340px, calc(100vw - 48px));
        display: flex;
        flex-direction: column;
        align-items: stretch;
        padding: 24px;
        opacity: 0;
        visibility: hidden;
        transform: translateY(-8px) scale(.985);
        transition: opacity 0.25s ease, transform 0.25s ease, visibility 0.25s;
        box-sizing: border-box;
      }

      .header.menu-open .header-actions {
        opacity: 1;
        visibility: visible;
        transform: translateY(0) scale(1);
      }

      .nav {
        margin: 0 0 20px 0;
        flex-direction: column;
        gap: 16px;
        top: 0;
      }
      .nav-link:first-child { top: 0; }
      .nav-link.active::after {
        left: 0;
        transform: none;
        bottom: -4px;
        width: 32px;
      }

      .time-panel {
        margin-left: 0;
        width: 100%;
        border-left: none;
        border-top: 1px solid rgba(255, 255, 255, .1);
        padding: 16px 0;
        height: auto;
      }

      .sign-up {
        width: 100%;
        margin-left: 0;
        height: 44px;
      }

      /* Hero Mobile Repositioning */
      .hero-content {
        bottom: var(--hero-bottom);
        width: calc(100vw - 48px);
        box-sizing: border-box;
      }

      .hero-title {
        letter-spacing: -1.2px;
        margin-bottom: 12px;
      }

      .line-one { transform: scaleX(.55); }
      .line-two { transform: scaleX(.78); }

      .hero-copy {
        width: 100%;
        font-size: 14px;
        line-height: 18px;
        margin-bottom: 20px;
      }

      .hero-copy br {
        display: none;
      }

      .primary-cta {
        width: 100%;
        height: 48px;
      }

      /* Demo Card moves to upper right */
      .demo-card {
        top: clamp(176px, 32svh, 300px);
        bottom: auto;
        right: var(--gutter-end);
        width: min(150px, 38vw);
      }
    }
  </style>
</head>
<body>
  <main class="viewport">
    <section class="screen" id="screen">
      <!-- Background loop video -->
      <video class="background" autoplay muted loop playsinline disablepictureinpicture aria-hidden="true">
        <source src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260808_064556_051587f1-74a1-4336-8c05-4dde3594ed05.mp4" type="video/mp4">
      </video>

      <!-- Header actions bar -->
      <header class="header">
        <!-- Brand link with SVG disc logo -->
        <a class="brand" href="#home" aria-label="Vantage home" style="display: inline-block; position: relative; top: 10px; filter: drop-shadow(0 1px 2px rgba(0,0,0,.3));">
          <svg width="25" height="25" viewBox="0 0 25 25" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g clip-path="url(#logo-clip)">
              <circle cx="12.5" cy="12.5" r="12.5" fill="#ededed" />
              <path d="M12.5 2.5 L20 10 L12.5 12.5 Z" fill="#050606" />
              <path d="M12.5 2.5 L12.5 12.5 L5 10 Z" fill="#737778" />
              <path d="M5 10 L12.5 12.5 L12.5 22.5 Z" fill="#fafafa" />
              <path d="M12.5 12.5 L20 10 L12.5 22.5 Z" fill="#0a0b0b" />
            </g>
            <defs>
              <clipPath id="logo-clip">
                <circle cx="12.5" cy="12.5" r="12.5" />
              </clipPath>
            </defs>
          </svg>
        </a>

        <!-- Dropdown panel controls (tablet / mobile responsive folding) -->
        <div class="header-actions glass-panel" id="tablet-navigation">
          <nav class="nav">
            <a class="nav-link active" href="#home">Home</a>
            <a class="nav-link" href="#about">About</a>
            <a class="nav-link" href="#services">Services</a>
            <a class="nav-link" href="#contact">Contact</a>
          </nav>
          
          <div class="time-panel">
            <span class="time-label">Timezone</span>
            <span class="time-value">9:47 PM&nbsp; • &nbsp;14 July 2026</span>
          </div>

          <button class="sign-up">Sign Up</button>
        </div>

        <!-- Two-line hamburger SVG menu trigger button -->
        <button class="menu-toggle" aria-label="Toggle menu" aria-expanded="false" aria-controls="tablet-navigation">
          <svg width="20" height="14" viewBox="0 0 20 14" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path class="line-t" d="M 2,3 L 18,3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
            <path class="line-b" d="M 2,11 L 18,11" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
          </svg>
        </button>
      </header>

      <!-- Hero stack (bottom left) -->
      <section class="hero">
        <div class="hero-content">
          <h1 class="hero-title">
            <span class="line line-one"><span class="line-reveal">Stop Digging</span></span>
            <span class="line line-two"><span class="line-reveal">Through Dashboards.</span></span>
          </h1>
          <p class="hero-copy">
            Your metrics are scattered across a dozen dashboards.<br>
            Vantage bring them into one clear signal, so every<br>
            decision is backed by data you actually trust.
          </p>
          <button class="primary-cta">
            <span class="label">Get Started</span>
            <span class="arrow-box">
              <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2" fill="none">
                <line x1="5" y1="12" x2="19" y2="12"></line>
                <polyline points="12 5 19 12 12 19"></polyline>
              </svg>
            </span>
          </button>
        </div>

        <!-- Glass Demo Card (bottom right) -->
        <article class="demo-card glass-panel" aria-label="Demo card">
          <div class="demo-visual">
            <img src="assets/watch-demo-thumbnail.png" alt="Abstract red and blue smoke">
            <button class="play" aria-label="Play demo">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <polygon points="5 3 19 12 5 21 5 3"></polygon>
              </svg>
            </button>
          </div>
          <button class="watch-button">Watch Demo</button>
        </article>
      </section>
    </section>
  </main>

  <script>
    // ── Entrance Motion Timing & Pending Classes ──
    document.addEventListener("DOMContentLoaded", () => {
      const html = document.documentElement;
      const demoCard = document.querySelector(".demo-card");

      // Safety timeout: 3500ms fallback to guarantee reveal
      const fallbackTimeout = setTimeout(() => {
        html.classList.remove("motion-pending");
      }, 3500);

      // Clean removal of pending state on card animate completion
      if (demoCard) {
        demoCard.addEventListener("animationend", (e) => {
          if (e.animationName === "entrance-card") {
            html.classList.remove("motion-pending");
            clearTimeout(fallbackTimeout);
          }
        });
      }

      // ── Responsive Menu Event Listeners ──
      const toggle = document.querySelector(".menu-toggle");
      const header = document.querySelector(".header");
      const navContainer = document.querySelector("#tablet-navigation");
      const links = document.querySelectorAll(".nav-link");

      const toggleMenu = (shouldOpen) => {
        const isOpen = shouldOpen !== undefined ? shouldOpen : !header.classList.contains("menu-open");
        
        header.classList.toggle("menu-open", isOpen);
        toggle.setAttribute("aria-expanded", isOpen);
        
        if (navContainer) {
          if (isOpen) {
            navContainer.removeAttribute("inert");
            // Set focus to the first active link on open
            const firstLink = navContainer.querySelector(".nav-link");
            if (firstLink) firstLink.focus();
          } else {
            // Set inert to avoid tab-focus traps when closed
            const isMenuCollapsible = window.innerWidth <= 1100;
            if (isMenuCollapsible) {
              navContainer.setAttribute("inert", "");
            } else {
              navContainer.removeAttribute("inert");
            }
          }
        }
      };

      if (toggle) {
        toggle.addEventListener("click", () => toggleMenu());
      }

      // Close menu on clicks outside or Escape press
      document.addEventListener("click", (e) => {
        const isClickInside = header.contains(e.target);
        if (!isClickInside && header.classList.contains("menu-open")) {
          toggleMenu(false);
        }
      });

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && header.classList.contains("menu-open")) {
          toggleMenu(false);
          toggle.focus();
        }
      });

      // Close menu on navigation clicks
      links.forEach(link => {
        link.addEventListener("click", () => {
          links.forEach(l => l.classList.remove("active"));
          link.classList.add("active");
          toggleMenu(false);
        });
      });

      // Synchronize initial inert state based on viewport resize
      const handleResize = () => {
        const isMenuCollapsible = window.innerWidth <= 1100;
        if (isMenuCollapsible && !header.classList.contains("menu-open")) {
          navContainer.setAttribute("inert", "");
        } else {
          navContainer.removeAttribute("inert");
        }
      };

      window.addEventListener("resize", handleResize);
      handleResize(); // trigger initial state check
    });
  </script>
</body>
</html>
